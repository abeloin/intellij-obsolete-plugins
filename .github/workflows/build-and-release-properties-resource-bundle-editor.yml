name: Build and Release Resource Bundle Editor

on:
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release and upload the plugin zip

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew buildPlugin
        working-directory: properties-resource-bundle-editor

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep '^version\s*=' build.gradle.kts | sed 's/version\s*=\s*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        working-directory: properties-resource-bundle-editor

      - name: Create GitHub Release
        # gh is preinstalled on GitHub-hosted runners; fails if a release for this tag already exists
        run: |
          gh release create "resource-bundle-editor-v$VERSION" \
            --title "Resource Bundle Editor v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "Built from $GITHUB_SHA" \
            properties-resource-bundle-editor/build/distributions/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
